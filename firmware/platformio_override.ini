[platformio]
default_envs = esp32c3_releaf

[env:esp32c3_releaf]
extends = env:esp32c3dev
custom_usermods = nanoleaf_shapes
build_flags = ${env:esp32c3dev.build_flags}
  -D LEAFBUS_TX_PIN=4
  -D LEAFBUS_RX_PIN=5
  -D LED_TYPES=TYPE_SK6812_RGBW
  -D DATA_PINS=10
  -D PIXEL_COUNTS=1
  -D BTNPIN=-1
  -D WLED_DISABLE_INFRARED
  -D WLED_DEBUG
  -D SERVERNAME='"Releaf"'
  -D MDNS_NAME='"releaf"'
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 460800
